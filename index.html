<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Моя презентация</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: #333;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        h1 {
            text-align: center;
            color: #667eea;
            margin-bottom: 30px;
            font-size: 1.8rem;
        }

        .section {
            margin-bottom: 30px;
            padding-bottom: 25px;
            border-bottom: 2px solid #f0f0f0;
        }

        .section:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }

        .section-title {
            font-weight: 600;
            color: #555;
            margin-bottom: 15px;
            font-size: 1.1rem;
        }

        .file-list {
            list-style: none;
        }

        .file-list li {
            margin-bottom: 12px;
        }

        .file-link {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            background: #f8f9fa;
            border-radius: 10px;
            text-decoration: none;
            color: #333;
            transition: all 0.2s ease;
            border: 2px solid transparent;
        }

        .file-link:hover {
            background: #667eea;
            color: white;
            border-color: #764ba2;
            transform: translateX(5px);
        }

        .file-icon {
            font-size: 1.4rem;
            min-width: 28px;
            text-align: center;
        }

        .file-name {
            flex: 1;
            font-weight: 500;
        }

        .file-ext {
            background: rgba(0,0,0,0.1);
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .file-link:hover .file-ext {
            background: rgba(255,255,255,0.3);
        }

        .date-badge {
            text-align: center;
            color: #888;
            font-size: 0.9rem;
            padding-top: 15px;
            border-top: 1px dashed #ddd;
        }

        @media (max-width: 480px) {
            .container {
                padding: 25px;
            }
            h1 {
                font-size: 1.4rem;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>📁 Моя презентация</h1>

        <!-- Презентации -->
        <div class="section">
            <div class="section-title">🎬 Презентации</div>
            <ul class="file-list">
                <li>
                    <a href="СетьВводный.pptx" class="file-link" download>
                        <span class="file-icon">📊</span>
                        <span class="file-name">СетьВводный</span>
                        <span class="file-ext">.pptx</span>
                    </a>
                </li>
            </ul>
        </div>

        <!-- HTML файлы -->
        <div class="section">
            <div class="section-title">🌐 Веб-страницы</div>
            <ul class="file-list">
                <li>
                    <a href="index.html" class="file-link" target="_blank">
                        <span class="file-icon">🌍</span>
                        <span class="file-name">index</span>
                        <span class="file-ext">.html</span>
                    </a>
                </li>
            </ul>
        </div>

        <!-- Таблицы -->
        <div class="section">
            <div class="section-title">📊 Таблицы и данные</div>
            <ul class="file-list">
                <li>
                    <a href="Таблица1.xlsx" class="file-link" download>
                        <span class="file-icon">🔢</span>
                        <span class="file-name">Новая таблица 1</span>
                        <span class="file-ext">.xlsx</span>
                    </a>
                </li>
                <li>
                    <a href="Таблица2.ods" class="file-link" download>
                        <span class="file-icon">📈</span>
                        <span class="file-name">Таблица 2</span>
                        <span class="file-ext">.ods</span>
                    </a>
                </li>
                <li>
                    <a href="Таблица3.xlsx" class="file-link" download>
                        <span class="file-icon">✅</span>
                        <span class="file-name">Таблица 3 задание</span>
                        <span class="file-ext">.xlsx</span>
                    </a>
                </li>
                <li>
                    <a href="Таблица4.xlsx" class="file-link" download>
                        <span class="file-icon">📋</span>
                        <span class="file-name">Новая таблица 4</span>
                        <span class="file-ext">.xlsx</span>
                    </a>
                </li>
            </ul>
        </div>

        <!-- Дата -->
        <div class="date-badge">
            📅 4 мая 2026
        </div>
    </div>

    <a href="krossvordRU.html">кроссворд Анатомия</a>
<a href="krossvordFa.html">кроссворд Фармакологияы</a>
    
</body>
</html>
